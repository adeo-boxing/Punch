<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PunchMeter Pro - Mobile</title>
    <style>
        /* Base de la page adaptée au tactile */
        body { 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; 
            text-align: center; 
            background: #121212; 
            color: #f0f0f0; 
            padding: 10px;
            margin: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* Cartes responsives */
        .card { 
            background: #1e1e1e; 
            padding: 20px 15px; 
            border-radius: 16px; 
            max-width: 100%; 
            margin: 12px auto; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.6); 
            border: 1px solid #2a2a2a; 
            box-sizing: border-box;
        }

        h1 { 
            color: #00ffcc; 
            margin-top: 0; 
            font-size: 1.8rem; 
        }

        h3 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #aaa;
        }
        
        /* Conteneur de stats ajusté pour 3 colonnes */
        .stats-container { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin: 25px 0; 
            gap: 5px;
        }

        .score-box { 
            flex: 1; 
            padding: 5px 2px;
        }

        .score-label { 
            font-size: 0.75rem; 
            color: #888; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            margin-bottom: 5px;
        }

        /* Chiffres sans virgules */
        .score { 
            font-size: 2.8rem; 
            font-weight: bold; 
            color: #ff3366; 
            line-height: 1.1;
        }

        .record { 
            font-size: 2.4rem; 
            font-weight: bold; 
            color: #ffcc00; 
            line-height: 1.1;
        }

        .reaction-val {
            font-size: 2.4rem; 
            font-weight: bold; 
            color: #00ffcc; 
            line-height: 1.1;
        }

        /* Formulaires et listes */
        label { 
            display: block; 
            margin: 18px 0 8px; 
            font-weight: bold; 
            text-align: left; 
            font-size: 1rem;
        }

        select { 
            width: 100%; 
            padding: 14px; 
            font-size: 1rem;
            border-radius: 8px; 
            border: none; 
            background: #2a2a2a; 
            color: white; 
            box-sizing: border-box;
            appearance: none; 
        }

        input[type="range"] { 
            width: 100%; 
            margin: 15px 0;
            height: 8px;
            border-radius: 5px;
            background: #2a2a2a;
        }

        /* Bouton d'action principal tactile et dynamique */
        button { 
            background: #00ffcc; 
            color: #121212; 
            border: none; 
            padding: 18px 30px; 
            font-size: 1.2rem; 
            font-weight: bold; 
            border-radius: 12px; 
            cursor: pointer; 
            width: 100%; 
            box-shadow: 0 4px 10px rgba(0, 255, 204, 0.2);
            transition: background 0.2s, color 0.2s;
        }

        /* Style quand le système est actif (Bouton d'arrêt) */
        button.actif {
            background: #ff3366;
            color: white;
            box-shadow: 0 4px 10px rgba(255, 51, 102, 0.2);
        }

        button:active { 
            transform: scale(0.98); 
        }

        .info { 
            color: #aaa; 
            font-size: 0.9rem; 
            text-align: left;
            margin-top: 5px;
        }
        
        #statut {
            font-size: 1.1rem;
            color: #00ffcc;
            font-weight: 500;
            margin: 15px 0;
        }

        /* Style de l'accordéon natif */
        details {
            width: 100%;
            text-align: left;
        }
        summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            color: #aaa;
            list-style: none;
            outline: none;
        }
        summary::-webkit-details-marker {
            display: none;
        }
        .chevron {
            font-size: 1rem;
            color: #00ffcc;
            transition: transform 0.2s ease;
        }
        details[open] .chevron {
            transform: rotate(180deg);
        }
        .details-content {
            margin-top: 15px;
        }

        /* Historique */
        .liste-historique { list-style: none; padding: 0; margin: 15px 0 0 0; text-align: left; }
        .liste-historique li { 
            padding: 14px; 
            background: #2a2a2a; 
            margin-bottom: 8px; 
            border-radius: 8px; 
            display: flex; 
            justify-content: space-between; 
            font-size: 1rem;
            border-left: 5px solid #00ffcc; 
        }
        .liste-historique li:first-child { background: #333; font-weight: bold; border-left-color: #ff3366; }
    </style>
</head>
<body>

    <div class="card">
        <h1>PunchMeter Pro 🥊</h1>
        
        <div class="stats-container">
            <div class="score-box">
                <div class="score-label">Dernier Coup</div>
                <div class="score" id="affichageScore">0</div>
            </div>
            <div class="score-box" style="border-left: 1px solid #333; border-right: 1px solid #333;">
                <div class="score-label">⏱️ Réaction</div>
                <div class="reaction-val" id="affichageReaction">-.---s</div>
            </div>
            <div class="score-box">
                <div class="score-label">🏆 Record</div>
                <div class="record" id="affichageRecord">0</div>
            </div>
        </div>

        <p id="statut">Prêt à démarrer.</p>
        <button id="btnConfiguration">DÉMARRER</button>
    </div>

    <div class="card">
        <h3>📋 Historique (5 derniers)</h3>
        <ul id="listeHistorique" class="liste-historique">
            <li style="border: none; color: #666; justify-content: center; background: transparent;">Aucun coup enregistré.</li>
        </ul>
    </div>

    <div class="card">
        <details>
            <summary>
                <span>⚙️ Réglages & Sensibilité</span>
                <span class="chevron">▼</span>
            </summary>
            <div class="details-content">
                <label for="selectMode">Mode de fonctionnement :</label>
                <select id="selectMode">
                    <option value="libre">Entraînement Libre (Continu)</option>
                    <option value="reaction">Test de Réaction (Signal Continu Automatique)</option>
                    <option value="combo">Test d'Enchaînement (Combo Aléatoire)</option>
                </select>

                <div id="wrapperCombo" style="display: none;">
                    <label for="selectNbCoupsCombo">Nombre de coups du combo :</label>
                    <select id="selectNbCoupsCombo">
                        <option value="1">1 coup</option>
                        <option value="2">2 coups</option>
                        <option value="3" selected>3 coups</option>
                        <option value="4">4 coups</option>
                        <option value="5">5 coups</option>
                        <option value="6">6 coups</option>
                    </select>
                </div>

                <label for="selectSupport">Support utilisé :</label>
                <select id="selectSupport">
                    <option value="sac">Sac Suspendu (Mobile)</option>
                    <option value="mur">Cible Murale (Fixe)</option>
                </select>

                <label for="sliderSensibilite">Seuil de choc :</label>
                <input type="range" id="sliderSensibilite" min="5" max="50" value="15">
                <div class="info">Seuil actuel : <span id="valeurSeuil" style="color: #00ffcc; font-weight:bold;">15</span> m/s²</div>
            </div>
        </details>
    </div>

    <script>
        let seuilDetection = 15; 
        let dureeFenetreImpact = 100; 
        let tempsAttenteAntiRebond = 1000; 
        
        let modeActuel = 'libre'; 
        let systemeActif = false; 
        let enTrainDeFrapper = false;
        let maxImpact = 0;
        let recordSession = 0;
        let historiqueCoups = [];
        let compteurCoups = 0;

        // Gestion de la réaction
        let sequenceEnCours = false;
        let signalDonne = false;
        let tempsSignal = 0;
        let timeoutSignal = null;
        let capteursInitialises = false;

        // Gestion du mode Combo
        let nombreCoupsCombo = 3;
        let coupsRestantsCombo = 0;
        let comboEnCours = false;

        const slider = document.getElementById('sliderSensibilite');
        const valeurSeuilText = document.getElementById('valeurSeuil');
        const selectSupport = document.getElementById('selectSupport');
        const selectMode = document.getElementById('selectMode');
        const wrapperCombo = document.getElementById('wrapperCombo');
        const selectNbCoupsCombo = document.getElementById('selectNbCoupsCombo');
        const affichageScore = document.getElementById('affichageScore');
        const affichageReaction = document.getElementById('affichageReaction');
        const affichageRecord = document.getElementById('affichageRecord');
        const listeHistorique = document.getElementById('listeHistorique');
        const statut = document.getElementById('statut');
        const btnConfig = document.getElementById('btnConfiguration');

        slider.addEventListener('input', (e) => {
            seuilDetection = parseFloat(e.target.value);
            valeurSeuilText.innerText = seuilDetection;
        });

        selectSupport.addEventListener('change', (e) => {
            if (e.target.value === 'sac') {
                dureeFenetreImpact = 100;    
                tempsAttenteAntiRebond = 1000; 
                slider.value = 15;
            } else if (e.target.value === 'mur') {
                dureeFenetreImpact = 30;     
                tempsAttenteAntiRebond = 500;  
                slider.value = 30;           
            }
            seuilDetection = parseFloat(slider.value);
            valeurSeuilText.innerText = seuilDetection;
        });

        selectMode.addEventListener('change', (e) => {
            modeActuel = e.target.value;
            if (modeActuel === 'combo') {
                wrapperCombo.style.display = 'block';
            } else {
                wrapperCombo.style.display = 'none';
            }
            arreterSysteme();
        });

        selectNbCoupsCombo.addEventListener('change', (e) => {
            nombreCoupsCombo = parseInt(e.target.value);
        });

        function annoncerTexte(texte) {
            let message = new SpeechSynthesisUtterance(texte);
            message.lang = 'fr-FR';
            message.rate = 1.3; 
            window.speechSynthesis.speak(message);
        }

        // Gestion globale du bouton unique (Marche / Arrêt)
        btnConfig.addEventListener('click', async () => {
            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceMotionEvent.requestPermission();
                    if (permission !== 'granted') {
                        statut.innerText = "Permission capteur refusée.";
                        return;
                    }
                } catch(e) {
                    statut.innerText = "Erreur d'accès aux capteurs.";
                    return;
                }
            }
            
            if (!capteursInitialises) {
                activerEcouteCapteurs();
                capteursInitialises = true;
            }

            if (!systemeActif) {
                // ALLUMAGE
                systemeActif = true;
                btnConfig.innerText = "ARRÊTER";
                btnConfig.classList.add('actif');

                if (modeActuel === 'libre') {
                    annoncerTexte("C'est parti");
                    statut.innerText = "Analyse en cours... Frappez !";
                    statut.style.color = "#00ffcc";
                } else if (modeActuel === 'reaction') {
                    lancerSequenceReaction();
                } else if (modeActuel === 'combo') {
                    lancerSequenceCombo();
                }
            } else {
                // EXTINCTION MANUELLE
                arreterSysteme();
            }
        });

        function arreterSysteme() {
            systemeActif = false;
            sequenceEnCours = false;
            signalDonne = false;
            enTrainDeFrapper = false;
            comboEnCours = false;
            if (timeoutSignal) clearTimeout(timeoutSignal);
            
            btnConfig.innerText = "DÉMARRER";
            btnConfig.classList.remove('actif');
            
            if (modeActuel === 'libre') {
                statut.innerText = "Prêt à démarrer.";
            } else if (modeActuel === 'reaction') {
                statut.innerText = "Prêt pour le test de réaction.";
            } else {
                statut.innerText = "Prêt pour le mode combo.";
            }
            statut.style.color = "#00ffcc";
        }

        // Lancement d'une séquence de signal (Boucle Mode Réaction)
        function lancerSequenceReaction() {
            if (!systemeActif) return;

            sequenceEnCours = true;
            signalDonne = false;
            enTrainDeFrapper = false;
            
            statut.innerText = "Attendez le signal...";
            statut.style.color = "#ffcc00";
            
            // Délai variable entre 1.5 et 5.0 secondes max
            let delaiAleatoire = 1500 + Math.random() * 3500;
            
            timeoutSignal = setTimeout(() => {
                if (!systemeActif || !sequenceEnCours) return; 
                
                signalDonne = true;
                tempsSignal = performance.now();
                statut.innerText = "💥 GO ! FRAPPEZ !";
                statut.style.color = "#00ff33"; 
                annoncerTexte("Allez");
            }, delaiAleatoire);
        }

        // Gestion du Mode Combo (Initialisation de l'enchaînement)
        function lancerSequenceCombo() {
            if (!systemeActif) return;
            comboEnCours = true;
            coupsRestantsCombo = nombreCoupsCombo;
            statut.innerText = "Préparez-vous...";
            statut.style.color = "#ffcc00";
            
            setTimeout(() => {
                if (!systemeActif || !comboEnCours) return;
                annoncerProchainCoupCombo();
            }, 1500);
        }

        // Annonce vocale du chiffre cible (1 à 6)
        function annoncerProchainCoupCombo() {
            let chiffreAleatoire = Math.floor(Math.random() * 6) + 1;
            let coupIndex = nombreCoupsCombo - coupsRestantsCombo + 1;
            statut.innerText = `🔥 CIBLE : Chiffre ${chiffreAleatoire} (${coupIndex}/${nombreCoupsCombo})`;
            statut.style.color = "#00ff33";
            
            // On capture le temps exact de l'annonce visuelle/vocale
            tempsSignal = performance.now(); 
            
            annoncerTexte(chiffreAleatoire.toString());
        }

        function activerEcouteCapteurs() {
            window.addEventListener('devicemotion', (event) => {
                if (!systemeActif) return; 

                let acc = event.acceleration;
                if (!acc || acc.x === null) return;

                let forceInstantanee = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);

                // GESTION DU FAUX DÉPART (Uniquement en mode réaction)
                if (modeActuel === 'reaction' && sequenceEnCours && !signalDonne) {
                    if (forceInstantanee > seuilDetection) {
                        clearTimeout(timeoutSignal);
                        sequenceEnCours = false;
                        statut.innerText = "❌ FAUX DÉPART !";
                        statut.style.color = "#ff3366";
                        annoncerTexte("Faux départ");
                        
                        // Relance automatique après une courte pénalité de 2 secondes
                        setTimeout(() => {
                            if (systemeActif && modeActuel === 'reaction') lancerSequenceReaction();
                        }, 2000);
                    }
                    return; 
                }

                // DÉTECTION DU COUP VALIDE
                if (modeActuel === 'libre' || (modeActuel === 'reaction' && signalDonne) || (modeActuel === 'combo' && comboEnCours)) {
                    
                    if (!enTrainDeFrapper && forceInstantanee > seuilDetection) {
                        enTrainDeFrapper = true;
                        maxImpact = forceInstantanee;
                        statut.innerText = "💥 IMPACT !";
                        statut.style.color = "#ff3366";

                        // Calcul du temps de réaction pour Réaction ET Combo
                        let tempsReactionCalcule = 0;
                        if (modeActuel === 'reaction' || modeActuel === 'combo') {
                            tempsReactionCalcule = (performance.now() - tempsSignal) / 1000;
                        }

                        setTimeout(() => {
                            // ARRONDISSEMENT SANS VIRGULE (Entier le plus proche)
                            let scoreArrondi = Math.round(maxImpact); 
                            affichageScore.innerText = scoreArrondi;
                            
                            // Affichage à l'écran du temps si mode réaction ou combo
                            if (modeActuel === 'reaction' || modeActuel === 'combo') {
                                affichageReaction.innerText = tempsReactionCalcule.toFixed(3) + "s";
                            } else {
                                affichageReaction.innerText = "-.---s";
                            }
                            
                            if (scoreArrondi > recordSession) {
                                recordSession = scoreArrondi;
                                affichageRecord.innerText = recordSession;
                                if (modeActuel !== 'combo') annoncerTexte("Record " + scoreArrondi);
                            } else {
                                if (modeActuel !== 'combo') annoncerTexte(scoreArrondi.toString());
                            }

                            // Enregistrement historique
                            compteurCoups++;
                            historiqueCoups.unshift({
                                numero: compteurCoups,
                                force: scoreArrondi,
                                reaction: (modeActuel === 'reaction' || modeActuel === 'combo') ? tempsReactionCalcule.toFixed(3) : null
                            });

                            if (historiqueCoups.length > 5) {
                                historiqueCoups.pop();
                            }
                            
                            listeHistorique.innerHTML = historiqueCoups.map((coup) => {
                                let details = `${coup.force} m/s²`;
                                if (coup.reaction) details += ` / ⏱️ ${coup.reaction}s`;
                                return `<li><span>Coup n°${coup.numero}</span> <b>${details}</b></li>`;
                            }).join('');

                            // Anti-rebond & relance automatique
                            setTimeout(() => {
                                enTrainDeFrapper = false;
                                if (systemeActif) {
                                    if (modeActuel === 'libre') {
                                        statut.innerText = "En attente du coup suivant...";
                                        statut.style.color = "#00ffcc";
                                    } else if (modeActuel === 'reaction') {
                                        lancerSequenceReaction();
                                    } else if (modeActuel === 'combo') {
                                        coupsRestantsCombo--;
                                        if (coupsRestantsCombo > 0) {
                                            // Il reste des coups dans le combo, on annonce le suivant
                                            annoncerProchainCoupCombo();
                                        } else {
                                            // Combo terminé, petite pause et on relance un enchaînement
                                            statut.innerText = "Enchaînement terminé !";
                                            statut.style.color = "#00ffcc";
                                            annoncerTexte("Enchaînement terminé");
                                            setTimeout(() => {
                                                if (systemeActif && modeActuel === 'combo') lancerSequenceCombo();
                                            }, 2500);
                                        }
                                    }
                                }
                            }, tempsAttenteAntiRebond);

                        }, dureeFenetreImpact);
                    } 
                    else if (enTrainDeFrapper && forceInstantanee > maxImpact) {
                        maxImpact = forceInstantanee;
                    }
                }
            });
        }
    </script>
</body>
</html>
